# Copy to config.yaml (gitignored) and adapt. On the Pi it lives in ~/home-dashboard/config.yaml.

timezone: Europe/Berlin

display:
  clock_refresh_seconds: 15
  page_reload_hours: 6      # full page reload as safety net for the kiosk browser, 0 = off

home:                       # lat / lon: location of the weather widget
  address: "Musterstraße 1, 06108 Halle (Saale)"
  lat: 51.482
  lon: 11.969

departures:
  refresh_seconds: 30       # how often the tablet updates the widget (countdowns)
  fetch_seconds: 60         # how often the Pi asks HAFAS at most (min. 15)
  max_per_stop: 8           # upper limit, the display shows as many as fit
  products: [tram]          # tram, bus, suburban, regional
  stops:
    # ids: numeric stop ids, look them up with `home-dashboard find-stop "<name> Halle"`
    # via: optional stop the tram must pass later = direction
    # direction: optional label next to the stop name, departures then show only the line number
    - name: "Rannischer Platz"
      id: "5258"
      walk_minutes: 5
      via: "5232"           # Marktplatz -> towards the city centre
      direction: "Markt"
    - name: "Franckeplatz"
      id: "5125"
      walk_minutes: 10
      via: "8010159"        # Hauptbahnhof -> towards the main station
      direction: "Hauptbahnhof"
      # lines: ["7", "94"]   # optional line filter

calendar:
  # Google Calendar > Settings > "Privatadresse im iCal-Format" (keep secret!)
  ical_url: null
  days: 14                  # upper limit, the display shows as many as fit
  refresh_seconds: 300      # how often the tablet updates the widget
  fetch_seconds: 600        # how often the Pi downloads the iCal feed at most (min. 60)
  people:                   # keywords are matched case-insensitively as whole words
    - name: "Person A"
      color: "#e07a5f"
      match: ["Person A"]
    - name: "Person B"
      color: "#3d85c6"
      match: ["Person B"]
  everyone:                 # events for everyone: keyword match OR no person recognized
    label: "Alle"
    color: "#c9b458"
    match: ["Alle", "Familie"]

weather:                    # Open-Meteo, no API key; location: home.lat / home.lon
  enabled: true
  refresh_seconds: 300      # how often the tablet updates the widget
  fetch_seconds: 900        # how often the Pi asks Open-Meteo at most (min. 300)
