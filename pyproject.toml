[project]
name = "home-dashboard"
version = "0.1.0"
description = "Wall dashboard for an old tablet: live tram departures, family calendar and weather"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
home-dashboard = "home_dashboard.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "playwright>=1.65.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to real external services (run explicitly with -m live)"]
# Fail on any warning so deprecations surface early (some libraries, e.g. Starlette, emit them as
# UserWarning, which a DeprecationWarning-only filter would miss)
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["home_dashboard"]
branch = true
