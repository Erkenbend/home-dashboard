{% extends "base.html" %}
{% block body %}
<header class="header">
  <div id="clock" hx-get="/widgets/clock" hx-trigger="every 15s">
    {% include "widgets/clock.html" %}
  </div>
</header>
<main class="widgets">
  {% if show_departures %}
  <section class="widget" id="departures" hx-get="/widgets/departures" hx-trigger="every 30s">
    {% include "widgets/departures.html" %}
  </section>
  {% endif %}
  {% if calendar %}
  <section class="widget widget-calendar" id="calendar" hx-get="/widgets/calendar" hx-trigger="every 300s">
    {% include "widgets/calendar.html" %}
  </section>
  {% endif %}
</main>
{% endblock %}
