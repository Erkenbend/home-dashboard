<!DOCTYPE html>
<html lang="{{ t('page.lang') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Full reload as a safety net for long-running kiosk browsers #}
  {% if config.display.page_reload_hours > 0 %}
  <meta http-equiv="refresh" content="{{ (config.display.page_reload_hours * 3600) | round | int }}">
  {% endif %}
  <title>{{ t('page.title') }}</title>
  {# Versioned URLs: a changed file gets a new URL, so the kiosk browser cannot keep a stale copy #}
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <script src="{{ static_url('htmx.min.js') }}"></script>
  <script src="{{ static_url('fit.js') }}"></script>
  <script src="{{ static_url('connection.js') }}"></script>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
