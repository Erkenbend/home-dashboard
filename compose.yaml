services:
  dashboard:
    image: home-dashboard:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "3274:3274"
    environment:
      TZ: Europe/Berlin
    extra_hosts:
      # Health checks of services on the Pi itself (status.services, see ADR 0005)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
